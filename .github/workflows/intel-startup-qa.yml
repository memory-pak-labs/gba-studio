name: Intel Arena cold startup diagnostics
on:
  workflow_call:
permissions:
  contents: write
  actions: read
jobs:
  diagnose:
    runs-on: macos-15-intel
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop-electron
    env:
      GBA_UPDATER_QA_ROOT: ${{ github.workspace }}/.intel-startup-qa
      GBA_UPDATER_QA_SOURCE_VERSION: 0.1.0-rc.6
      GBA_UPDATER_QA_TARGET_VERSION: 0.1.0-rc.7
      GBA_UPDATER_QA_TARGET_DRAFT: '1'
      GBA_UPDATER_QA_TARGET_SHA: 094f23a906474f750ed7cf499683198d46f864bf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci
      - name: Fetch and verify the unchanged frozen candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-published-updater-qa.mjs
      - name: Compile Arena once and compare cold compiler policies
        run: node scripts/diagnose-intel-startup.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Intel-Arena-cold-startup
          path: ${{ github.workspace }}/.intel-startup-qa/evidence/
          if-no-files-found: error
          retention-days: 3
