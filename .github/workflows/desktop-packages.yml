name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      engine_pack_run_id:
        description: 'Optional prior run with an identical engine source tree and ARM-Engine-Pack artifact'
        type: string
        default: ''
      updater_qa_source_run_id:
        description: 'Optional successful package run to test installed updates without rebuilding production packages'
        type: string
        default: ''
      updater_qa_platform:
        description: 'Platform for the isolated updater test'
        type: choice
        options: [both, linux, windows]
        default: both
      updater_qa_published:
        description: 'Test an exact release pair on Windows, Linux and both Mac architectures'
        type: boolean
        default: false
      updater_qa_source_version:
        description: 'Published version installed before the update'
        type: string
        default: '0.1.0-rc.6'
      updater_qa_target_version:
        description: 'Target release or unpublished candidate version'
        type: string
        default: '0.1.0-rc.7'
      updater_qa_target_draft:
        description: 'Read the target from an authenticated draft; keep public feeds unchanged'
        type: boolean
        default: false
      updater_qa_target_sha:
        description: 'Full frozen source commit required for an unpublished candidate'
        type: string
        default: ''
      updater_qa_native_platform:
        description: 'Native updater host to validate; all retains the existing platform selection'
        type: choice
        options: [all, windows, linux, macos-intel, macos-arm64, macos-intel-display, macos-intel-remaining, macos-intel-startup, macos-intel-fixed]
        default: all
      updater_qa_scene_build_timeout_ms:
        description: 'Bounded cold scene export wait (300000-900000 ms); ROM performance checks remain unchanged'
        type: string
        default: '300000'

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-packages-${{ github.ref }}-${{ (inputs.updater_qa_published || inputs.updater_qa_source_run_id != '') && github.run_id || 'build' }}
  cancel-in-progress: true

jobs:
  engine-pack:
    name: Compile ARM Engine Pack
    if: inputs.updater_qa_source_run_id == '' && !inputs.updater_qa_published
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the source identity of a reused Engine Pack
        if: inputs.engine_pack_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_RUN_ID: ${{ inputs.engine_pack_run_id }}
        run: |
          case "$PACK_RUN_ID" in ''|*[!0-9]*) echo 'Invalid prior run ID'; exit 1;; esac
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACK_RUN_ID" --jq '.head_sha')
          git merge-base --is-ancestor "$source_sha" HEAD
          test -z "$(git diff --name-only "$source_sha" HEAD -- packages/GBAStudioEngine)"
          echo "Reuse ARM Engine Pack from unchanged engine source: $source_sha"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.engine_pack_run_id != ''
        with:
          name: ARM-Engine-Pack
          path: packages/GBAStudioEngine/dist/GBAStudioEnginePack
          run-id: ${{ inputs.engine_pack_run_id }}
          github-token: ${{ github.token }}
      - name: Build with the pinned devkitPro image
        if: inputs.engine_pack_run_id == ''
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" \
            -w /work/packages/GBAStudioEngine \
            devkitpro/devkitarm@sha256:15b79ce75822c289538d8153da5fa7aafe5e6adc32ad8a575a197beca0f0761b \
            bash -eu -c 'apt-get update && apt-get install -y --no-install-recommends clang python3-pil && make -j2 package'
          sudo chown -R "$(id -u):$(id -g)" packages/GBAStudioEngine/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ARM-Engine-Pack
          path: packages/GBAStudioEngine/dist/GBAStudioEnginePack/
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: Package and smoke (${{ matrix.platform }})
    needs: engine-pack
    runs-on: ${{ matrix.runner }}
    # Both installer creation and 18 separate scene ROM builds run in this job.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            script: dist:linux
          - platform: windows
            runner: windows-2022
            script: dist:win
    defaults:
      run:
        working-directory: apps/desktop-electron
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONUTF8: '1'
      GBA_STUDIO_OFFLINE_SMOKE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop-electron/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ARM-Engine-Pack
          path: packages/GBAStudioEngine/dist/GBAStudioEnginePack
      - name: Linux desktop dependencies and compiler tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libudev-dev
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        id: msys
        if: matrix.platform == 'windows'
        with:
          location: C:\msys64
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Native compiler for the bundled ROM header tool
        if: matrix.platform == 'windows'
        env:
          MSYS_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: |
          (Join-Path $env:MSYS_ROOT 'ucrt64\bin') >> $env:GITHUB_PATH
          (Join-Path $env:MSYS_ROOT 'usr\bin') >> $env:GITHUB_PATH
          "GBA_STUDIO_MSYS_SOURCE=$(Join-Path $env:MSYS_ROOT 'usr')" >> $env:GITHUB_ENV
      - run: npm ci
      - name: Audit cross-platform package config
        run: npm run audit:cross-platform -- --strict
      - name: Verify the WebPlayer core
        run: npm run verify:mgba-web
      - name: Package x64 desktop
        run: npm run ${{ matrix.script }}
      - name: Check installer files
        run: npm run smoke:ci-artifacts -- --platform ${{ matrix.platform }}
      - name: Export exact source and bundled license supplement
        run: python scripts/build-release-supplement.py --runtime build/embedded-runtime --platform ${{ matrix.platform }}-x64 --output release/GBA-Studio-${{ matrix.platform }}-x64-licenses-and-sources.zip --allow-generated-icons
      - name: Smoke Linux packaged editor and complete project
        if: matrix.platform == 'linux'
        run: |
          deb=$(find release -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          sudo apt-get install -y "$PWD/$deb"
          package=$(dpkg-deb -f "$deb" Package)
          installed=$(dpkg -L "$package" | grep '^/opt/.*/gba-studio$' | head -1)
          test -f "$installed" && test -x "$installed"
          export GBA_STUDIO_PACKAGED_APP_PATH="$installed"
          node_exe=$(command -v node)
          sudo env GBA_STUDIO_PACKAGED_APP_PATH="$installed" GBA_STUDIO_OFFLINE_SMOKE=1 \
            GBA_STUDIO_OFFLINE_NETWORK=namespace-no-uplink \
            unshare --net bash -eu -c '
              ip link set lo up
              setpriv --reuid "$2" --regid "$3" --init-groups xvfb-run -a "$1" scripts/smoke-electron-welcome.mjs --packaged
              setpriv --reuid "$2" --regid "$3" --init-groups xvfb-run -a "$1" scripts/smoke-electron-exemplo-template.mjs --packaged
              setpriv --reuid "$2" --regid "$3" --init-groups xvfb-run -a "$1" scripts/smoke-electron-exemplo-scenes.mjs --packaged
            ' bash "$node_exe" "$(id -u)" "$(id -g)"
      - name: Smoke Windows packaged editor and complete project
        if: matrix.platform == 'windows'
        run: |
          $installer = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          $installedRoot = Join-Path $env:RUNNER_TEMP 'GBA Studio installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installedRoot" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installation failed: $($process.ExitCode)" }
          $env:GBA_STUDIO_PACKAGED_APP_PATH = Join-Path $installedRoot 'gba-studio.exe'
          if (!(Test-Path $env:GBA_STUDIO_PACKAGED_APP_PATH)) { throw 'Installed executable missing' }
          $python = Join-Path $installedRoot 'resources\Runtime\Python\python.exe'
          foreach ($program in @($env:GBA_STUDIO_PACKAGED_APP_PATH, $python)) {
            New-NetFirewallRule -DisplayName "GBA Studio offline $program" -Direction Outbound -Action Block -Program $program -Profile Any | Out-Null
          }
          & $python -I -c "import socket; s=socket.socket();s.settimeout(5);assert s.connect_ex(('1.1.1.1',443)) != 0, 'Internet still reachable'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GBA_STUDIO_OFFLINE_NETWORK = 'outbound-firewall'
          node scripts/smoke-electron-welcome.mjs --packaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-electron-exemplo-template.mjs --packaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-electron-exemplo-scenes.mjs --packaged
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Evidence-${{ matrix.platform }}
          path: |
            apps/desktop-electron/artifacts/welcome/latest/
            apps/desktop-electron/artifacts/exemplo-template/latest/
            apps/desktop-electron/artifacts/exemplo-scene-playtest/latest/
            apps/desktop-electron/artifacts/ci-artifacts/latest/
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload validated installer candidates
        if: env.GBA_STUDIO_RUNTIME_SOURCES_READY == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GBA-Studio-${{ matrix.platform }}-x64
          path: |
            apps/desktop-electron/release/*.exe
            apps/desktop-electron/release/*.zip
            apps/desktop-electron/release/*.AppImage
            apps/desktop-electron/release/*.deb
            apps/desktop-electron/release/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  installed-updater-qa:
    name: Installed updater QA (${{ matrix.platform }})
    if: inputs.updater_qa_source_run_id != '' && !inputs.updater_qa_published
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.updater_qa_platform == 'linux' && '[{"platform":"linux","runner":"ubuntu-24.04"}]' || inputs.updater_qa_platform == 'windows' && '[{"platform":"windows","runner":"windows-2022"}]' || '[{"platform":"windows","runner":"windows-2022"},{"platform":"linux","runner":"ubuntu-24.04"}]') }}
    defaults:
      run:
        working-directory: apps/desktop-electron
    env:
      GBA_UPDATER_QA_ROOT: ${{ github.workspace }}/.updater-qa
      GBA_UPDATER_QA_ARTIFACTS: ${{ github.workspace }}/.updater-artifacts
      GBA_UPDATER_QA_HTTP_PORT: '9758'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop-electron/package-lock.json
      - name: Verify the installed candidate matches product sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QA_RUN_ID: ${{ inputs.updater_qa_source_run_id }}
        run: |
          case "$QA_RUN_ID" in ''|*[!0-9]*) echo 'Invalid package run ID'; exit 1;; esac
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_RUN_ID")
          source_sha=$(printf '%s' "$run" | node -e 'const d=JSON.parse(require("node:fs").readFileSync(0,"utf8")); if(d.conclusion!=="success"||d.path!==".github/workflows/desktop-packages.yml")process.exit(1); process.stdout.write(d.head_sha)')
          git merge-base --is-ancestor "$source_sha" HEAD
          git diff --name-only "$source_sha" HEAD > "$RUNNER_TEMP/updater-qa-changed-files.txt"
          node -e 'const fs=require("node:fs"),path=require("node:path"); const allowed=new Set([".github/workflows/desktop-packages.yml","apps/desktop-electron/scripts/updater-qa-fixture.mjs","apps/desktop-electron/scripts/updater-qa-fixture.test.mjs","apps/desktop-electron/scripts/updater-qa-workflow.test.mjs","apps/desktop-electron/scripts/prepare-updater-qa.mjs","apps/desktop-electron/scripts/smoke-installed-update.mjs"]); const changed=fs.readFileSync(path.join(process.env.RUNNER_TEMP,"updater-qa-changed-files.txt"),"utf8").split(/\r?\n/).filter(Boolean); const unexpected=changed.filter(f=>!allowed.has(f)); if(unexpected.length)throw new Error("Product sources differ from the packaged candidate: "+unexpected.join(", "))'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: GBA-Studio-${{ matrix.platform }}-x64
          path: ${{ github.workspace }}/.updater-artifacts
          run-id: ${{ inputs.updater_qa_source_run_id }}
          github-token: ${{ github.token }}
      - name: Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libudev-dev libfuse2t64
      - run: npm ci
      - name: Prepare isolated installed application and simulated successor
        run: node scripts/prepare-updater-qa.mjs
      - name: Test update and project persistence on Windows
        if: matrix.platform == 'windows'
        run: node scripts/smoke-installed-update.mjs
      - name: Test update and project persistence on Linux
        if: matrix.platform == 'linux'
        run: xvfb-run -a node scripts/smoke-installed-update.mjs
      - name: Upload updater evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Updater-QA-${{ matrix.platform }}
          path: ${{ github.workspace }}/.updater-qa/evidence/
          if-no-files-found: ignore
          retention-days: 7

  published-updater-qa:
    name: ${{ inputs.updater_qa_native_platform == 'macos-intel-remaining' && 'Intel remaining scenes (55 FPS gate retained)' || format('Published updater QA ({0})', matrix.platform) }}
    if: inputs.updater_qa_published && inputs.updater_qa_native_platform != 'macos-intel-display' && inputs.updater_qa_native_platform != 'macos-intel-startup' && inputs.updater_qa_native_platform != 'macos-intel-fixed'
    # GitHub hides drafts from contents:read tokens. This manual QA job reads
    # the pinned draft and its assets; it contains no release publication steps.
    permissions:
      contents: write
    runs-on: ${{ matrix.runner }}
    # Full installed update plus authoring and 18 scene ROMs; Linux packaging
    # measured over an hour, so retain the tests with a realistic host budget.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            (inputs.updater_qa_native_platform == 'macos-intel' || inputs.updater_qa_native_platform == 'macos-intel-remaining') && '[{"platform":"macos-intel","runner":"macos-15-intel","architecture":"x64"}]' ||
            inputs.updater_qa_native_platform == 'macos-arm64' && '[{"platform":"macos-arm64","runner":"macos-15","architecture":"arm64"}]' ||
            (inputs.updater_qa_native_platform == 'linux' || (inputs.updater_qa_native_platform == 'all' && inputs.updater_qa_platform == 'linux')) && '[{"platform":"linux","runner":"ubuntu-24.04","architecture":"x64"}]' ||
            (inputs.updater_qa_native_platform == 'windows' || (inputs.updater_qa_native_platform == 'all' && inputs.updater_qa_platform == 'windows')) && '[{"platform":"windows","runner":"windows-2022","architecture":"x64"}]' ||
            '[{"platform":"windows","runner":"windows-2022","architecture":"x64"},{"platform":"linux","runner":"ubuntu-24.04","architecture":"x64"},{"platform":"macos-intel","runner":"macos-15-intel","architecture":"x64"},{"platform":"macos-arm64","runner":"macos-15","architecture":"arm64"}]'
          ) }}
    defaults:
      run:
        working-directory: apps/desktop-electron
    env:
      GBA_UPDATER_QA_ROOT: ${{ github.workspace }}/.published-updater-qa
      GBA_UPDATER_QA_SOURCE_VERSION: ${{ inputs.updater_qa_source_version }}
      GBA_UPDATER_QA_TARGET_VERSION: ${{ inputs.updater_qa_target_version }}
      GBA_UPDATER_QA_TARGET_DRAFT: ${{ inputs.updater_qa_target_draft && '1' || '0' }}
      GBA_UPDATER_QA_TARGET_SHA: ${{ inputs.updater_qa_target_sha }}
      GBA_STUDIO_EXEMPLO_SCENE_BUILD_TIMEOUT_MS: ${{ inputs.updater_qa_scene_build_timeout_ms }}
      GBA_UPDATER_QA_SCENE_SCOPE: ${{ inputs.updater_qa_native_platform == 'macos-intel-remaining' && 'intel-remaining' || 'full' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop-electron/package-lock.json
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libudev-dev libfuse2t64
      - run: npm ci
      - name: Verify QA changes preserve the frozen candidate
        if: inputs.updater_qa_target_draft
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          assert.equal(process.arch, '${{ matrix.architecture }}', 'QA requires the native target architecture');
          const sha = process.env.GBA_UPDATER_QA_TARGET_SHA;
          assert.match(sha, /^[a-f0-9]{40}$/);
          execFileSync('git', ['merge-base', '--is-ancestor', sha, 'HEAD']);
          const allowed = new Set(['.github/workflows/desktop-packages.yml',
            '.github/workflows/native-display-qa.yml',
            '.github/workflows/intel-startup-qa.yml',
            '.github/workflows/intel-arena-regression.yml',
            'apps/desktop-electron/scripts/diagnose-intel-startup.mjs',
            'apps/desktop-electron/scripts/diagnose-intel-player.cjs',
            'apps/desktop-electron/scripts/diagnose-intel-installed.mjs',
            'apps/desktop-electron/scripts/lib/electron-smoke-helpers.mjs',
            'apps/desktop-electron/scripts/lib/electron-smoke-helpers.test.mjs',
            'apps/desktop-electron/scripts/diagnose-macos-display.cjs',
            'apps/desktop-electron/scripts/battle-effect-framebuffer-contract.mjs',
            'apps/desktop-electron/scripts/battle-effect-framebuffer-contract.test.mjs',
            'apps/desktop-electron/scripts/updater-qa-release-plan.mjs',
            'apps/desktop-electron/scripts/updater-qa-release-plan.test.mjs',
            'apps/desktop-electron/scripts/updater-qa-workflow.test.mjs',
            'apps/desktop-electron/scripts/prepare-published-updater-qa.mjs',
            'apps/desktop-electron/scripts/smoke-electron-exemplo-template.mjs',
            'apps/desktop-electron/scripts/smoke-electron-exemplo-scenes.mjs',
            'apps/desktop-electron/scripts/exemplo-template-smoke-contract.mjs',
            'apps/desktop-electron/scripts/exemplo-template-smoke-contract.test.mjs',
            'apps/desktop-electron/scripts/smoke-installed-update.mjs']);
          const files = execFileSync('git', ['diff', '--name-only', sha, 'HEAD'], { encoding: 'utf8' }).trim().split(/\r?\n/).filter(Boolean);
          assert(files.every(file => allowed.has(file)), 'QA revision changes the frozen product sources');
          console.log('Frozen candidate product sources preserved');
          JS
      - name: Verify and prepare the published packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-published-updater-qa.mjs
      - name: Exercise installed update and project persistence
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node scripts/smoke-installed-update.mjs
          else
            node scripts/smoke-installed-update.mjs
          fi
      - name: Validate updated installed editor and ROM on the native host
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, mkdirSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          import { intelRemainingFunctionalEvidence } from './scripts/exemplo-template-smoke-contract.mjs';
          const root = process.env.GBA_UPDATER_QA_ROOT;
          const fixture = JSON.parse(readFileSync(path.join(root, 'fixture.json'), 'utf8'));
          let app = process.platform === 'darwin' ? path.dirname(path.dirname(path.dirname(fixture.sourceExecutable)))
            : process.platform === 'linux' ? path.join(path.dirname(fixture.sourceExecutable), path.basename(fixture.targetInstaller)) : fixture.sourceExecutable;
          if (process.platform === 'linux') {
            // The updater already exercised the real AppImage and verified its
            // installed hash. Run that payload directly when offline smokes
            // clear PATH; the AppImage shell launcher needs the host's bash.
            const extraction = path.join(root, 'installed-appimage-payload');
            mkdirSync(extraction, { recursive: true });
            const unpack = spawnSync(app, ['--appimage-extract'], { cwd: extraction, env: process.env, stdio: 'ignore' });
            assert.equal(unpack.status, 0, 'Extract the exact installed AppImage for offline validation');
            app = path.join(extraction, 'squashfs-root', 'gba-studio');
          }
          const sceneContinuation = process.env.GBA_UPDATER_QA_SCENE_SCOPE === 'intel-remaining';
          assert(!sceneContinuation || (process.platform === 'darwin' && process.arch === 'x64'), 'Continuation requires native Intel');
          const env = { ...process.env, GBA_STUDIO_PACKAGED_APP_PATH: app, GBA_STUDIO_OFFLINE_SMOKE: '1',
            APPIMAGE_EXTRACT_AND_RUN: '1', ELECTRON_DISABLE_SANDBOX: '1',
            ...(process.platform === 'darwin' ? {
              GBA_STUDIO_MAC_ARCH: process.arch, GBA_STUDIO_SMOKE_ARCH: process.arch === 'x64' ? 'x86_64' : 'arm64'
            } : {}),
            GBA_STUDIO_EXEMPLO_TEMPLATE_OUTPUT: path.join(root, 'evidence', 'installed-template'),
            GBA_STUDIO_EXEMPLO_SCENES_OUTPUT: path.join(root, 'evidence', 'installed-scenes') };
          const scripts = [ ...(process.platform === 'darwin' ? ['smoke-macos-app-bundle.mjs'] : []),
            ...(sceneContinuation ? ['smoke-electron-exemplo-scenes.mjs']
              : ['smoke-electron-welcome.mjs', 'smoke-electron-exemplo-template.mjs', 'smoke-electron-exemplo-scenes.mjs']) ];
          for (const script of scripts) {
            env.GBA_STUDIO_SMOKE_OUTPUT_DIR = path.join(root, 'evidence', script.replace('.mjs', ''));
            const command = process.platform === 'linux' ? 'xvfb-run' : process.execPath;
            const args = [...(process.platform === 'linux' ? ['-a', process.execPath] : []), `scripts/${script}`, '--packaged',
              ...(sceneContinuation && script === 'smoke-electron-exemplo-scenes.mjs'
                ? ['--scenes=arena_arrancada,circuito_final,arena_tatica,circuito_perspectiva'] : [])];
            const result = spawnSync(command, args, { env, stdio: 'inherit' });
            if (sceneContinuation && script === 'smoke-electron-exemplo-scenes.mjs') {
              const evidence = JSON.parse(readFileSync(path.join(env.GBA_STUDIO_EXEMPLO_SCENES_OUTPUT, 'exemplo_scene_playtest_evidence.json'), 'utf8'));
              const summary = { ...intelRemainingFunctionalEvidence(evidence), candidateCommit: process.env.GBA_UPDATER_QA_TARGET_SHA,
                rawSmokeExitCode: result.status };
              writeFileSync(path.join(root, 'evidence', 'intel-remaining-functional.json'), JSON.stringify(summary, null, 2) + '\n');
              console.log(JSON.stringify(summary, null, 2));
            }
            assert.equal(result.status, 0, `${script} failed: ${result.error ?? result.signal ?? result.status}`);
          }
          JS
      - name: Upload updater evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Published-updater-QA-${{ matrix.platform }}
          path: ${{ github.workspace }}/.published-updater-qa/evidence/
          if-no-files-found: ignore
          retention-days: 7

  display-qa:
    if: inputs.updater_qa_native_platform == 'macos-intel-display'
    uses: ./.github/workflows/native-display-qa.yml

  intel-startup-qa:
    if: inputs.updater_qa_native_platform == 'macos-intel-startup'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/intel-startup-qa.yml
    with:
      diagnostic_run_id: ${{ inputs.updater_qa_source_run_id }}

  intel-fixed-qa:
    if: inputs.updater_qa_native_platform == 'macos-intel-fixed'
    uses: ./.github/workflows/intel-arena-regression.yml
    with:
      diagnostic_run_id: ${{ inputs.updater_qa_source_run_id }}
      product_sha: ${{ inputs.updater_qa_target_sha }}
