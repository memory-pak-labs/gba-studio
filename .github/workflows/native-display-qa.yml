name: Native display diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  display:
    name: Native Intel display capability
    runs-on: macos-15-intel
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop-electron
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci
      - name: Read modes and measure the unmodified display clock
        env:
          GBA_DISPLAY_QA_OUTPUT: ${{ github.workspace }}/.display-qa
        run: node_modules/.bin/electron scripts/diagnose-macos-display.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Native-Intel-display-diagnostics
          path: ${{ github.workspace }}/.display-qa/display-diagnostics.json
          if-no-files-found: error
          retention-days: 7
