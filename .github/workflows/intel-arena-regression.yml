name: Native Intel Arena cold-start regression
on:
  workflow_call:
    inputs:
      full_export:
        type: boolean
        default: false
      trace_pacing:
        type: boolean
        default: false
      product_sha:
        required: true
        type: string
      diagnostic_run_id:
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  arena:
    name: Intel cold emulation and PCM (30 Hz display)
    runs-on: macos-15-intel
    timeout-minutes: ${{ inputs.full_export && 45 || 20 }}
    env:
      GBA_INTEL_SOURCE_SHA: ${{ inputs.product_sha }}
    defaults:
      run:
        working-directory: product/apps/desktop-electron
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: qa-driver
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.product_sha }}
          path: product
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validate the diagnostic source run
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_RUN_ID: ${{ inputs.diagnostic_run_id }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const id = process.env.DIAGNOSTIC_RUN_ID;
          assert.match(id, /^[1-9][0-9]+$/);
          assert.match(process.env.GBA_INTEL_SOURCE_SHA, /^[a-f0-9]{40}$/);
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), process.env.GBA_INTEL_SOURCE_SHA);
          const run = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${id}`], { encoding: 'utf8' }));
          assert.equal(run.conclusion, 'success');
          assert.equal(run.path, '.github/workflows/desktop-packages.yml');
          assert.equal(run.head_sha, 'e034fc78e957d30c7e4aa3cd4af00aa98da9228c');
          JS
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Intel-Arena-cold-startup
          path: .intel-arena/evidence
          run-id: ${{ inputs.diagnostic_run_id }}
          github-token: ${{ github.token }}
      - run: npm ci
      - run: npm run build
      - name: Verify identical ROM and emulation core
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const root = process.env.GITHUB_WORKSPACE + '/.intel-arena/evidence';
          const original = JSON.parse(readFileSync(`${root}/comparison.json`, 'utf8'));
          assert.equal(original.candidate, '094f23a906474f750ed7cf499683198d46f864bf');
          const sha = file => createHash('sha256').update(readFileSync(file)).digest('hex');
          assert.equal(sha(`${root}/rom/arena_arrancada.gba`), original.romHash);
          assert.equal(sha('static/WebPlayer/player/mgba-core.wasm'), original.coreHash);
          execFileSync('git', ['diff', '--exit-code', original.candidate, 'HEAD', '--',
            '../../packages/GBAStudioEngine', 'default-assets', 'src/shared', 'src/renderer'], { stdio: 'pipe' });
          const changedStatic = execFileSync('git', ['diff', '--name-only', original.candidate, 'HEAD', '--', 'static'], { encoding: 'utf8' }).trim().split(/\r?\n/).filter(Boolean);
          const framebufferFiles = new Set(['apps/desktop-electron/static/WebPlayer/player/mgba-direct-player.mjs', 'apps/desktop-electron/static/WebPlayer/player/runtime.html']);
          assert(changedStatic.every(file => framebufferFiles.has(file)), 'Unexpected static or audio changes');
          const oldPlayer = execFileSync('git', ['show', `${original.candidate}:apps/desktop-electron/static/WebPlayer/player/mgba-direct-player.mjs`], { encoding: 'utf8' });
          const currentPlayer = readFileSync('static/WebPlayer/player/mgba-direct-player.mjs', 'utf8');
          const audioSection = text => {
            const start = text.indexOf('    const AudioContext =');
            const end = text.indexOf('    const inspectAudioRegisters =', start);
            assert(start >= 0 && end > start);return text.slice(start, end);
          };
          assert.equal(audioSection(currentPlayer), audioSection(oldPlayer), 'Native audio processing must remain byte-for-byte unchanged');
          const provenance = { sourceCommit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            driverCommit: process.env.GITHUB_SHA, originalCandidate: original.candidate, romHash: original.romHash, coreHash: original.coreHash,
            platform: process.platform, architecture: process.arch, audioModified: false, publicationApproved: false };
          assert.equal(process.platform, 'darwin');assert.equal(process.arch, 'x64');
          writeFileSync(`${root}/fixed-source.json`, JSON.stringify(provenance, null, 2) + '\n');
          JS
      - name: Counterbalance canvas backends and trace pacing
        if: inputs.trace_pacing
        env:
          GBA_UPDATER_QA_ROOT: ${{ github.workspace }}/.intel-arena
          GBA_INTEL_APP: ${{ github.workspace }}/product/apps/desktop-electron
        run: node "$GITHUB_WORKSPACE/qa-driver/apps/desktop-electron/scripts/trace-intel-canvas.mjs"
      - name: Replay three fresh processes with unchanged audio and first-window gates
        if: ${{ !inputs.trace_pacing }}
        env:
          GBA_UPDATER_QA_ROOT: ${{ github.workspace }}/.intel-arena
          GBA_INTEL_APP: ${{ github.workspace }}/product/apps/desktop-electron
          GBA_INTEL_LABEL: fixed-source
          GBA_INTEL_REQUIRE_PASS: '1'
          GBA_INTEL_EXPECT_SOFTWARE: '1'
        run: node "$GITHUB_WORKSPACE/qa-driver/apps/desktop-electron/scripts/diagnose-intel-installed.mjs"
      # Draft reads require contents:write; this manual job never publishes.
      - name: Verify frozen embedded export resources
        if: inputs.full_export
        env:
          GH_TOKEN: ${{ github.token }}
          GBA_UPDATER_QA_ROOT: ${{ github.workspace }}/.intel-export-resources
          GBA_UPDATER_QA_SOURCE_VERSION: 0.1.0-rc.6
          GBA_UPDATER_QA_TARGET_VERSION: 0.1.0-rc.7
          GBA_UPDATER_QA_TARGET_DRAFT: '1'
          GBA_UPDATER_QA_TARGET_SHA: 094f23a906474f750ed7cf499683198d46f864bf
        run: |
          ln -s "$GITHUB_WORKSPACE/product/apps/desktop-electron/node_modules" "$GITHUB_WORKSPACE/qa-driver/apps/desktop-electron/node_modules"
          node "$GITHUB_WORKSPACE/qa-driver/apps/desktop-electron/scripts/prepare-published-updater-qa.mjs"
      - name: Export and play Arena from the exact fixed source
        if: inputs.full_export
        env:
          GBA_UPDATER_QA_ROOT: ${{ github.workspace }}/.intel-arena
          GBA_STUDIO_EXEMPLO_APP_ROOT: ${{ github.workspace }}/product/apps/desktop-electron
          GBA_STUDIO_ENGINE_PACK_DIR: ${{ github.workspace }}/.intel-export-resources/reference/gba-studio.app/Contents/Resources/EnginePack/GBAStudioEnginePack
          GBA_STUDIO_EXEMPLO_SCENES_OUTPUT: ${{ github.workspace }}/.intel-arena/evidence/full-export
          GBA_STUDIO_EXEMPLO_SCENE_BUILD_TIMEOUT_MS: '900000'
          GBA_STUDIO_OFFLINE_SMOKE: '1'
          GBA_STUDIO_TRACE_SCENE_SMOKE: '1'
        run: |
          node "$GITHUB_WORKSPACE/qa-driver/apps/desktop-electron/scripts/verify-intel-source-export.mjs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Intel-Arena-fixed-source
          path: |
            .intel-arena/evidence/fixed-source.json
            .intel-arena/evidence/installed-*.json
            .intel-arena/evidence/counterbalanced-*.json
            .intel-arena/evidence/full-export/
          if-no-files-found: error
          retention-days: 7
