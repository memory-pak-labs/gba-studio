name: Assemble verified release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing draft release tag'
        required: true
        type: string
      package_run_id:
        description: 'Successful Desktop packages run with tested Windows/Linux installers'
        required: true
        type: string
      source_sha:
        description: 'Full source commit shared by the draft and the packaging run'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare checksums from verified CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 scripts/release-qa/bootstrap_checksums.py
      - name: Verify, assemble and upload installers while preserving the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PY'
          import base64, concurrent.futures, hashlib, json, os, re, subprocess
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          run_id = os.environ['PACKAGE_RUN_ID']
          sha = os.environ['SOURCE_SHA']
          version = tag.removeprefix('v')
          assert re.fullmatch(r'v[0-9][A-Za-z0-9._-]*', tag), 'Invalid release tag'
          assert run_id.isdigit(), 'Invalid packaging run ID'
          assert re.fullmatch(r'[0-9a-f]{40}', sha), 'Invalid source commit'

          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)

          def release():
              result = json.loads(gh('release', 'view', tag, '--repo', repo,
                  '--json', 'assets,createdAt,isDraft,tagName,targetCommitish'))
              assert result['isDraft'], 'Only draft releases can be assembled'
              assert result['tagName'] == tag and result['targetCommitish'] == sha
              return result

          release_created = release()['createdAt']
          run = json.loads(gh('api', f'repos/{repo}/actions/runs/{run_id}'))
          assert run['head_sha'] == sha and run['conclusion'] == 'success'
          assert run['path'] == '.github/workflows/desktop-packages.yml'
          stage = Path('release-staging')
          stage.mkdir()
          gh('release', 'download', tag, '--repo', repo, '--pattern', 'SHA256SUMS.txt', '--dir', str(stage))
          checksums = {}
          for line in (stage / 'SHA256SUMS.txt').read_text().splitlines():
              digest, name = line.split('  ', 1)
              assert re.fullmatch(r'[0-9a-f]{64}', digest) and Path(name).name == name
              assert name not in checksums
              checksums[name] = digest

          def digest(path):
              result = hashlib.sha256()
              with path.open('rb') as stream:
                  for data in iter(lambda: stream.read(1024 * 1024), b''):
                      result.update(data)
              return result.hexdigest()

          def artifact(name):
              gh('run', 'download', run_id, '--repo', repo, '--name', name, '--dir', str(stage / name))

          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as executor:
              list(executor.map(artifact, ['GBA-Studio-windows-x64', 'GBA-Studio-linux-x64']))
          installers = []
          for folder in ['GBA-Studio-windows-x64', 'GBA-Studio-linux-x64']:
              for path in list((stage / folder).rglob('*')):
                  if path.is_file():
                      name = path.name.replace(' ', '.')
                      for platform in ['windows-x64', 'linux-x64']:
                          if name == f'GBA-Studio-{platform}-licenses-and-sources.zip':
                              name = f'GBA-Studio-{version}-{platform}-licenses-and-sources.zip'
                      assert name in checksums, f'Unexpected package file: {name}'
                      assert digest(path) == checksums[name], f'Package hash mismatch: {name}'
                      if name != path.name:
                          path = path.rename(stage / name)
                      installers.append((path, name))
          assert len(installers) == 7

          gh('release', 'download', tag, '--repo', repo, '--pattern', 'UPLOAD_CHUNKS.json', '--dir', str(stage))
          manifest = json.loads((stage / 'UPLOAD_CHUNKS.json').read_text())
          assert manifest['tag'] == tag and manifest['sourceTagTarget'] == sha
          expected_mac = {f'GBA-Studio-{version}-macOS-{arch}.{extension}'
                          for arch in ['arm64', 'x64'] for extension in ['dmg', 'zip']}
          assert len(manifest['files']) == 4
          assert {file['name'] for file in manifest['files']} == expected_mac
          parts = [p for f in manifest['files'] for p in f['parts']]
          assert len({p['name'] for p in parts}) == len(parts)
          chunks = stage / 'chunks'
          chunks.mkdir()

          def chunk(part):
              name = part['name']
              assert re.fullmatch(r'upload-chunk-mac-(arm64|x64)-(dmg|zip)-[0-9]{3}\.part', name)
              gh('release', 'download', tag, '--repo', repo, '--pattern', name, '--dir', str(chunks))
              path = chunks / name
              assert path.stat().st_size == part['bytes'] and digest(path) == part['sha256']

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as executor:
              list(executor.map(chunk, parts))
          for file in manifest['files']:
              name = file['name']
              assert Path(name).name == name and name in checksums
              assert name in expected_mac
              assert file['sha256'] == checksums[name]
              path = stage / name
              with path.open('wb') as output:
                  for part in file['parts']:
                      with (chunks / part['name']).open('rb') as stream:
                          while data := stream.read(1024 * 1024):
                              output.write(data)
              assert path.stat().st_size == file['bytes'] and digest(path) == checksums[name]
              installers.append((path, name))
          assert len({name for _, name in installers}) == 11
          existing = {a['name']: a for a in release()['assets']}

          def upload(item):
              path, name = item
              if name in existing:
                  assert existing[name]['state'] == 'uploaded'
                  assert existing[name]['digest'] == 'sha256:' + checksums[name]
              else:
                  gh('release', 'upload', tag, str(path), '--repo', repo)

          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              list(executor.map(upload, installers))
          uploaded = {a['name']: a for a in release()['assets']}
          for path, name in installers:
              asset = uploaded[name]
              assert asset['state'] == 'uploaded' and asset['size'] == path.stat().st_size
              assert asset['digest'] == 'sha256:' + checksums[name], f'Uploaded hash mismatch: {name}'

          # Create feeds from the final verified bytes and public names, including
          # the notarized Mac ZIPs after they have been reconstructed from chunks.
          # JSON is a YAML subset accepted by electron-updater's YAML parser.
          def update_entry(path, name):
              sha512 = hashlib.sha512()
              with path.open('rb') as stream:
                  for data in iter(lambda: stream.read(1024 * 1024), b''):
                      sha512.update(data)
              return {'url': name, 'sha512': base64.b64encode(sha512.digest()).decode(),
                      'size': path.stat().st_size}

          def select(predicate, count):
              selected = [(path, name) for path, name in installers if predicate(name)]
              assert len(selected) == count, f'Expected {count} update installers, found {len(selected)}'
              return [update_entry(path, name) for path, name in sorted(selected, key=lambda item: item[1])]

          feeds = {
              'latest.yml': select(lambda name: name.endswith('.exe'), 1),
              'latest-linux.yml': select(lambda name: name.endswith('.AppImage'), 1),
              'latest-mac.yml': select(lambda name: name in {f'GBA-Studio-{version}-macOS-{arch}.zip' for arch in ['arm64', 'x64']}, 2),
          }
          update_files = []
          for name, entries in feeds.items():
              feed = {'version': version, 'files': entries, 'path': entries[0]['url'],
                      'sha512': entries[0]['sha512'], 'releaseDate': release_created}
              path = stage / name
              path.write_text(json.dumps(feed, ensure_ascii=False, indent=2) + '\n')
              checksums[name] = digest(path)
              update_files.append((path, name))
          for item in update_files:
              upload(item)
          uploaded = {a['name']: a for a in release()['assets']}
          for path, name in update_files:
              asset = uploaded[name]
              assert asset['state'] == 'uploaded' and asset['size'] == path.stat().st_size
              assert asset['digest'] == 'sha256:' + checksums[name], f'Uploaded feed hash mismatch: {name}'
          for part in parts:
              gh('release', 'delete-asset', tag, part['name'], '--repo', repo, '--yes')
          gh('release', 'delete-asset', tag, 'UPLOAD_CHUNKS.json', '--repo', repo, '--yes')
          release()
          print('Installers and update feeds verified; temporary chunks removed; release remains a draft.')
          PY
